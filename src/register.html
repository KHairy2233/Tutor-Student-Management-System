<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تسجيل طالب جديد - مستر محمد عبد التواب</title>

  <!-- Google Fonts: Cairo & Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- RemixIcons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #64748b;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.03);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.04);
      --touch-target: 48px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      direction: rtl;
      text-align: right;
    }

    .register-wrapper {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .register-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      padding: 36px 28px;
      position: relative;
      overflow: hidden;
    }

    .register-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: white;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      margin-bottom: 16px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .page-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      height: var(--touch-target);
      padding: 10px 44px 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
      background: white;
      color: var(--text-main);
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    select.form-control {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='20' height='20' fill='%2364748b'%3e%3cpath d='M12 15l-5-5h10z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: left 14px center;
    }

    .btn-submit {
      width: 100%;
      height: var(--touch-target);
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      touch-action: manipulation;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .alert-banner {
      display: none;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    .alert-success {
      display: flex;
      background: var(--success-light);
      color: #065f46;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .alert-error {
      display: flex;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .dev-branding {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      direction: ltr;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .register-card {
        padding: 28px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="register-wrapper">
    <div class="register-card">
      <div class="register-header">
        <div class="brand-badge"><i class="ri-graduation-cap-fill"></i></div>
        <h1 class="brand-name">مستر محمد عبد التواب</h1>
        <div class="page-title">تسجيل طالب جديد</div>
      </div>

      <!-- Success / Error Alert Banner -->
      <div id="alert-banner" class="alert-banner"></div>

      <form id="registration-form" onsubmit="handleRegistration(event)">
        <div class="form-group">
          <label class="form-label" for="reg-student-name">اسم الطالب *</label>
          <div class="input-wrapper">
            <i class="ri-user-3-line"></i>
            <input type="text" id="reg-student-name" class="form-control" placeholder="أدخل اسم الطالب ثلاثي أو رباعي" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-parent-phone">رقم ولي الأمر *</label>
          <div class="input-wrapper">
            <i class="ri-phone-line"></i>
            <input type="tel" id="reg-parent-phone" class="form-control" placeholder="مثال: 01012345678" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-group-select">اختر المجموعة *</label>
          <div class="input-wrapper">
            <i class="ri-team-line"></i>
            <select id="reg-group-select" class="form-control" required>
              <option value="">جاري تحميل المجموعات المتاحة...</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <i class="ri-checkbox-circle-line"></i>
          <span>تسجيل</span>
        </button>
      </form>
    </div>

    <!-- Branding requirement 3: Footer credit -->
    <div class="dev-branding">Made by Mahmoud Khairy</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadPublicGroups();
    });

    function loadPublicGroups() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onGroupsLoaded)
          .withFailureHandler(onGroupsError)
          .getPublicGroups();
      } else {
        var select = document.getElementById('reg-group-select');
        select.innerHTML = '<option value="">-- اختر المجموعة --</option><option value="GRP-1">الصف الثالث الثانوي - عربي</option>';
      }
    }

    function onGroupsLoaded(groups) {
      var select = document.getElementById('reg-group-select');
      var currVal = select.value;
      select.innerHTML = '<option value="">-- اختر المجموعة --</option>';

      if (!groups || groups.length === 0) {
        select.innerHTML = '<option value="">لا توجد مجموعات متاحة حالياً</option>';
        return;
      }

      groups.forEach(function(g) {
        var opt = document.createElement('option');
        opt.value = g.GroupID;
        var info = g.GroupName + ' (' + (g.Grade || '') + (g.Days ? ' - ' + g.Days : '') + ')';
        opt.innerText = info;
        select.appendChild(opt);
      });

      if (currVal) select.value = currVal;
    }

    function onGroupsError(err) {
      showAlert('خطأ في تحميل المجموعات: ' + err.message, 'error');
    }

    function handleRegistration(e) {
      e.preventDefault();
      var name = document.getElementById('reg-student-name').value.trim();
      var phone = document.getElementById('reg-parent-phone').value.trim();
      var groupID = document.getElementById('reg-group-select').value;

      if (!name || !phone || !groupID) {
        showAlert('يرجى ملء جميع الحقول المطلوبة.', 'error');
        return;
      }

      // Phone Number Validation (numeric 10 to 15 digits)
      var phoneClean = phone.replace(/[\s\-\+\(\)]/g, '');
      if (!/^\d{10,15}$/.test(phoneClean)) {
        showAlert('يرجى إدخال رقم هاتف ولي أمر صحيح (من 10 إلى 15 رقم).', 'error');
        return;
      }

      setSubmitting(true);
      hideAlert();

      var payload = {
        studentName: name,
        parentPhone: phone,
        groupID: groupID
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onRegistrationSuccess)
          .withFailureHandler(onRegistrationError)
          .registerStudentPublic(payload);
      } else {
        setTimeout(function() {
          onRegistrationSuccess({ success: true, message: 'تم تسجيل بياناتك بنجاح.' });
        }, 800);
      }
    }

    function onRegistrationSuccess(res) {
      setSubmitting(false);
      // Clear Student Name & Parent Phone fields, keep group selected as specified
      document.getElementById('reg-student-name').value = '';
      document.getElementById('reg-parent-phone').value = '';

      showAlert(res.message || 'تم تسجيل بياناتك بنجاح.', 'success');
    }

    function onRegistrationError(err) {
      setSubmitting(false);
      showAlert(err.message || 'حدث خطأ أثناء حفظ البيانات. يرجى المحاولة مرة أخرى.', 'error');
    }

    function setSubmitting(isSubmitting) {
      var btn = document.getElementById('submit-btn');
      if (isSubmitting) {
        btn.disabled = true;
        btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> <span>جاري التسجيل...</span>';
      } else {
        btn.disabled = false;
        btn.innerHTML = '<i class="ri-checkbox-circle-line"></i> <span>تسجيل</span>';
      }
    }

    function showAlert(msg, type) {
      var banner = document.getElementById('alert-banner');
      banner.className = 'alert-banner alert-' + type;
      banner.innerHTML = (type === 'success' ? '<i class="ri-checkbox-circle-fill" style="font-size:20px;"></i> ' : '<i class="ri-error-warning-fill" style="font-size:20px;"></i> ') + msg;
      banner.style.display = 'flex';
    }

    function hideAlert() {
      var banner = document.getElementById('alert-banner');
      banner.style.display = 'none';
    }
  </script>
</body>
</html>
